    <style>
      /* Layout: the ChatGPT desktop app in Work mode (Codex), dark by default, as in Minh's 28 Oct screenshot.
     Rail + sidebar + thread, and the Kaijan side panel: a read-only report with the tabs Map, Test plan
     and one tab per run (Run 1, Run 2…, per aUY's 29 Oct review), plus a compact inline card. */
:root {
  --chrome: #141414;
  --win: #1a1a1a;
  --side: #1c1c1c;
  --raise: #222222;
  --raise2: #2a2a2a;
  --line: #2e2e2e;
  --line2: #262626;
  --ink: #ececec;
  --ink2: #c8c8c8;
  --muted: #9a9a9a;
  --faint: #6f6f6f;
  --bubble: #2c2c2c;
  --blue: #4a86f0;
  --k-ink: #5fd3a0;
  --k-soft: rgba(31, 160, 111, 0.16);
  --k-line: rgba(95, 211, 160, 0.35);
  --o: #f28c28;
  --o-ink: #f7aa5f;
  --o-soft: rgba(242, 140, 40, 0.15);
  --o-line: rgba(242, 140, 40, 0.42);
  --bad: #ef6b5f;
  --bad-soft: rgba(239, 107, 95, 0.14);
  --bad-line: rgba(239, 107, 95, 0.42);
  --shop: #24382f;
  --sans:
    -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto,
    Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --panelw: 580px;
  color-scheme: dark;
}
html,
body {
  height: 100%;
}
body {
  background: var(--chrome);
  color: var(--ink);
  font: 14px/1.5 var(--sans);
  overflow: hidden;
}
* {
  box-sizing: border-box;
}
button,
input,
textarea,
select {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  background: none;
  border: 0;
  padding: 0;
}
button:focus-visible,
summary:focus-visible,
select:focus-visible,
textarea:focus-visible,
input:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
svg.i {
  width: 17px;
  height: 17px;
  flex: none;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.mono {
  font-family: var(--mono);
  font-size: 12px;
}
.num {
  font-variant-numeric: tabular-nums;
}

/* ---------- host window ---------- */
.win {
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--chrome);
}
.titlebar {
  height: 44px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px 0 16px;
}
.lights {
  display: flex;
  gap: 8px;
  margin-right: 16px;
}
.lights i {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ff5f57;
}
.lights i:nth-child(2) {
  background: #febc2e;
}
.lights i:nth-child(3) {
  background: #28c840;
}
.tb-btn {
  width: 28px;
  height: 28px;
  border-radius: 7px;
  display: grid;
  place-items: center;
  color: var(--muted);
}
.tb-btn:hover {
  background: var(--line2);
  color: var(--ink);
}
.tb-btn.off {
  color: var(--faint);
}
.titlebar .sp {
  flex: 1;
}
.plus {
  display: flex;
  align-items: center;
  gap: 6px;
  color: #6ea2ff;
  font-weight: 600;
  font-size: 14px;
  margin-right: 8px;
}

.body {
  flex: 1;
  min-height: 0;
  display: flex;
}
.rail {
  width: 56px;
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 6px 0 12px;
}
.rail span {
  width: 38px;
  height: 38px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  color: var(--muted);
}
.rail .on {
  background: var(--raise2);
  color: var(--ink);
}
.rail .dl {
  margin-top: auto;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--blue);
  color: #fff;
}
.rail .me {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #8a4fd6;
  color: #fff;
  font-size: 10.5px;
  font-weight: 700;
}

.shell {
  flex: 1;
  min-width: 0;
  display: grid;
  grid-template-columns: 252px minmax(0, 1fr) var(--panelw);
  background: var(--win);
  border: 1px solid var(--line2);
  border-right: 0;
  border-bottom: 0;
  border-radius: 12px 0 0 0;
  overflow: hidden;
}
.win.closed .shell {
  grid-template-columns: 252px minmax(0, 1fr);
}

.sidebar {
  background: var(--side);
  border-right: 1px solid var(--line2);
  padding: 14px 10px 10px;
  display: flex;
  flex-direction: column;
  gap: 1px;
  overflow: auto;
  min-width: 0;
}
.brand {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 8px 10px;
}
.brand b {
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -0.2px;
}
.brand .chev {
  color: var(--muted);
  margin-right: auto;
}
.brand .tb-btn {
  width: 26px;
  height: 26px;
}
.s-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 8px;
  border-radius: 9px;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 14.5px;
}
.s-item:hover {
  background: var(--line2);
}
.s-item.on {
  background: var(--raise2);
}
.s-head {
  font-size: 14px;
  color: var(--muted);
  padding: 16px 8px 6px;
}
.s-sub {
  padding-left: 34px;
  font-size: 14px;
  color: var(--ink2);
}
.s-sub.on {
  color: var(--ink);
}
.started {
  margin-top: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 10px;
  border-radius: 10px;
  background: var(--raise);
  font-size: 13.5px;
  font-weight: 600;
}
.started i {
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 1.5px solid var(--muted);
}
.started span {
  margin-left: auto;
  color: var(--muted);
  font-weight: 400;
}

/* ---------- thread ---------- */
.chat {
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
}
.chat-top {
  flex: none;
  height: 56px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 0 14px;
  gap: 10px;
}
.crumb {
  color: var(--muted);
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.crumb b {
  color: var(--ink);
  font-weight: 500;
}
.mode {
  display: flex;
  background: var(--raise);
  border-radius: 999px;
  padding: 3px;
}
.mode span {
  padding: 5px 22px;
  border-radius: 999px;
  color: var(--ink2);
  font-size: 14px;
}
.mode .on {
  background: var(--raise2);
  color: var(--ink);
}
.thread {
  flex: 1;
  overflow: auto;
  padding: 4px 16px 10px;
}
.thread-in {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.when {
  text-align: center;
  color: var(--faint);
  font-size: 12.5px;
}
.u {
  align-self: flex-end;
  max-width: 82%;
  background: var(--bubble);
  border-radius: 20px;
  padding: 9px 15px;
  white-space: pre-wrap;
}
.u .tag {
  color: var(--k-ink);
  font-weight: 600;
}
.a p {
  margin: 0 0 6px;
}
.a p:last-child {
  margin: 0;
}
.a ul {
  margin: 4px 0 0;
  padding-left: 18px;
}
.tool {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 13px;
}
.tool b {
  color: var(--ink2);
  font-weight: 600;
}
.tool .dot {
  width: 14px;
  height: 14px;
  display: grid;
  place-items: center;
}
.tool .dot i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--k-ink);
}
.spin {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  border: 2px solid var(--k-line);
  border-top-color: var(--k-ink);
  animation: spin 0.8s linear infinite;
  flex: none;
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
.worked {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--faint);
  font-size: 12.5px;
}
.worked::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line);
}

.diff {
  border: 1px solid var(--line);
  border-radius: 12px;
  overflow: hidden;
  font-size: 12.5px;
  background: var(--raise);
}
.diff-h {
  display: flex;
  gap: 8px;
  align-items: center;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  font-weight: 600;
}
.add {
  color: var(--k-ink);
}
.del {
  color: var(--bad);
}
.diff-r {
  display: flex;
  gap: 10px;
  padding: 5px 12px;
  border-top: 1px solid var(--line2);
}
.diff-r:first-of-type {
  border-top: 0;
}
.diff-r .mono {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--ink2);
}
.pr {
  color: var(--muted);
  font-size: 13px;
  display: flex;
  gap: 6px;
  align-items: center;
}
.pr b {
  color: var(--ink);
  font-weight: 600;
}

/* turn artifacts in the thread (Thống's "▧ App map ↗" card) */
.kc {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  max-width: 470px;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px 12px;
  background: var(--raise);
  transition:
    border-color 0.15s,
    background 0.15s;
}
button.kc:hover {
  border-color: #444;
  background: #262626;
}
.kc.cur {
  border-color: var(--k-ink);
}
.kc .ic {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  background: var(--k-soft);
  color: var(--k-ink);
  flex: none;
}
.kc .ic.o {
  background: var(--o-soft);
  color: var(--o-ink);
}
.kc .ic.r {
  background: var(--bad-soft);
  color: var(--bad);
}
.kc .tx {
  flex: 1;
  min-width: 0;
}
.kc .t1 {
  font-weight: 600;
}
.kc .t2 {
  color: var(--muted);
  font-size: 12.5px;
}
.kc .go {
  color: var(--muted);
  font-size: 15px;
}
.bar {
  display: flex;
  height: 5px;
  border-radius: 3px;
  overflow: hidden;
  background: var(--line);
  margin-top: 5px;
  max-width: 220px;
}
.bar i {
  display: block;
  height: 100%;
}
.bar .p {
  background: var(--k-ink);
}
.bar .f {
  background: var(--bad);
}

/* compact inline card (Thống v08) */
.inl {
  max-width: 560px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--raise);
  overflow: hidden;
}
.inl-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 14px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}
.inl-bar .sp {
  flex: 1;
}
.cp {
  padding: 14px 16px 16px;
  display: grid;
  gap: 10px;
}
.cp h3 {
  margin: 0;
  font-size: 17px;
  letter-spacing: -0.2px;
}
.cp-flow {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.cp-flow span {
  padding: 8px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 13px;
  background: var(--side);
}
.cp-flow span.chg {
  border-color: var(--o-line);
}
.cp-flow span.pass {
  border-color: var(--k-line);
}
.cp-flow span.fail {
  border-color: var(--bad);
  color: var(--bad);
}
.cp-flow i {
  color: var(--faint);
  font-style: normal;
}
.cp-rows {
  display: grid;
  gap: 6px;
}
.cp-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 13px;
  text-align: left;
  width: 100%;
}
button.cp-row:hover .tt {
  text-decoration: underline;
}
.cp-row .n {
  color: var(--muted);
}
.cp-fail {
  color: var(--bad);
  font-size: 12.5px;
}
.cp-f {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  padding-top: 4px;
}

.bug {
  max-width: 520px;
  border: 1px solid var(--line);
  border-radius: 14px;
  overflow: hidden;
  background: var(--raise);
}
.bug-h {
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
}
.bug-b {
  padding: 10px 12px;
  font-size: 12.5px;
  display: grid;
  gap: 6px;
  margin: 0;
}
.bug-b dt {
  color: var(--muted);
  font-size: 11.5px;
}
.bug-b dd {
  margin: 0;
}
.bug-f {
  display: flex;
  gap: 8px;
  padding: 0 12px 12px;
  align-items: center;
  flex-wrap: wrap;
}
.bug textarea {
  width: 100%;
  height: 90px;
  font: 11.5px/1.45 var(--mono);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px;
  resize: vertical;
  background: var(--win);
}

/* composer, as in the host */
.composer-wrap {
  padding: 0 16px 16px;
  flex: none;
}
.composer-in {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.chips {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.chip {
  border: 1px solid var(--ink);
  border-radius: 999px;
  padding: 5px 13px;
  font-size: 13px;
  font-weight: 600;
  color: #161616;
  background: var(--ink);
}
.chip:hover {
  background: #fff;
  border-color: #fff;
}
.composer {
  position: relative;
  z-index: 1;
  border: 1px solid #383838;
  border-radius: 22px;
  padding: 12px 12px 8px 14px;
  background: var(--raise2);
}
.composer textarea {
  width: 100%;
  border: 0;
  resize: none;
  outline: none;
  min-height: 24px;
  max-height: 120px;
  background: transparent;
  padding: 0;
  line-height: 1.5;
  font-size: 15px;
}
.composer textarea::placeholder {
  color: var(--faint);
}
.composer textarea:focus-visible {
  outline: none;
}
.c-foot {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 10px;
  color: var(--ink2);
  font-size: 14px;
}
.c-foot .sp {
  flex: 1;
}
.c-foot .appr {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
}
.c-foot .model b {
  font-weight: 500;
  color: var(--ink);
}
.c-foot .model {
  color: var(--muted);
}
.send {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--blue);
  color: #fff;
  display: grid;
  place-items: center;
}
.send:disabled {
  background: #3a3a3a;
  color: var(--faint);
  cursor: default;
}
.send svg.i {
  stroke-width: 2;
}
.tray {
  margin: -14px 14px 0;
  padding: 22px 14px 8px;
  background: var(--raise);
  border-radius: 0 0 16px 16px;
  display: flex;
  align-items: center;
  gap: 20px;
  font-size: 14px;
  color: var(--ink2);
}
.tray span {
  display: flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
}
.tray .sp {
  flex: 1;
}
.tray .proj b {
  font-weight: 500;
  color: var(--ink);
}
.tray .kj {
  color: var(--k-ink);
  background: var(--k-soft);
  border-radius: 6px;
  padding: 0 6px;
  font-size: 12px;
  font-weight: 600;
}

.ask {
  border: 1px solid #383838;
  border-radius: 20px;
  padding: 14px 14px 10px;
  background: var(--raise2);
}
.ask h4 {
  margin: 0 0 10px;
  font-size: 15px;
  font-weight: 600;
  text-wrap: balance;
}
.opt {
  display: flex;
  gap: 11px;
  align-items: flex-start;
  width: 100%;
  text-align: left;
  padding: 8px 10px;
  border-radius: 11px;
}
.opt:hover,
.opt.hl {
  background: #333;
}
.opt .n {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  border: 1px solid #444;
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 600;
  flex: none;
  color: var(--ink2);
}
.opt .ol {
  font-weight: 600;
}
.opt .od {
  color: var(--muted);
  font-size: 13px;
}
.opt input {
  width: 100%;
  border: 0;
  border-bottom: 1px solid #444;
  padding: 2px 0;
  outline: none;
  background: transparent;
}
.ask-f {
  display: flex;
  justify-content: space-between;
  color: var(--faint);
  font-size: 12px;
  padding: 6px 10px 0;
}
.ask-f button {
  color: var(--muted);
}

/* ---------- Kaijan side panel ---------- */
.panel {
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
  min-width: 0;
  background: var(--side);
}
.win.closed .panel {
  display: none;
}
.p-tabs-host {
  display: flex;
  align-items: flex-end;
  gap: 6px;
  padding: 8px 10px 0;
  background: var(--win);
  border-bottom: 1px solid var(--line);
}
.ftab {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 34px;
  padding: 0 8px 0 12px;
  background: var(--side);
  border: 1px solid var(--line);
  border-bottom: 0;
  border-radius: 10px 10px 0 0;
  font-size: 13px;
  margin-bottom: -1px;
}
.ftab .x {
  color: var(--muted);
  width: 20px;
  height: 20px;
  display: grid;
  place-items: center;
  border-radius: 5px;
}
.ftab .x:hover {
  background: var(--line);
  color: var(--ink);
}
.p-tabs-host .sp {
  flex: 1;
}
.p-tabs-host .tb-btn {
  margin-bottom: 4px;
}
.p-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 18px 4px;
  font-size: 13px;
}
.p-head .sp {
  flex: 1;
}
.sw {
  color: var(--muted);
  font-size: 13px;
  padding: 4px 8px;
  border-radius: 7px;
}
.sw:hover {
  background: var(--line2);
  color: var(--ink);
}
.p-body {
  flex: 1;
  overflow: auto;
  padding: 16px 18px 28px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.p-body > * {
  flex-shrink: 0;
}
.kmas {
  width: 24px;
  height: 24px;
  flex: none;
  display: block;
}
.k-word {
  font-family: "Archivo", var(--sans);
  font-weight: 750;
  font-size: 15px;
  letter-spacing: -0.3px;
}

.vtool {
  display: flex;
  flex-direction: column;
  gap: 14px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 14px;
}
.vtabs {
  display: flex;
  gap: 2px;
  box-shadow: inset 0 -1px var(--line);
  overflow-x: auto;
  scrollbar-width: none;
  position: relative;
}
.vtabs::-webkit-scrollbar {
  display: none;
}
.vtabs button {
  padding: 8px 10px 10px;
  border-bottom: 2px solid transparent;
  color: var(--muted);
  font-weight: 600;
  font-size: 13.5px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex: none;
  white-space: nowrap;
}
.vtabs .sico {
  width: 16px;
  height: 16px;
}
.vtabs .sico svg {
  width: 10px;
  height: 10px;
}
.vtabs .spin {
  width: 12px;
  height: 12px;
  border-color: rgba(74, 134, 240, 0.25);
  border-top-color: var(--blue);
}
.vtabs button[aria-current="page"] {
  color: var(--ink);
  border-color: var(--ink);
}
.vtabs button:disabled {
  opacity: 0.35;
  cursor: default;
}
.vtabs .cnt {
  font-size: 11px;
  font-weight: 600;
  border-radius: 9px;
  padding: 0 6px;
  background: var(--line);
  color: var(--muted);
}
.vtabs .cnt.bad {
  background: var(--bad-soft);
  color: var(--bad);
}
.vtitle {
  display: flex;
  align-items: center;
  gap: 12px;
}
.vtitle h2 {
  margin: 0;
  font-size: 22px;
  font-weight: 650;
  letter-spacing: -0.4px;
  flex: 1;
}

.ph {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}
.ph h3 {
  margin: 2px 0 0;
  font-size: 16px;
  line-height: 1.3;
  text-wrap: balance;
}
.ph .sp {
  flex: 1;
}
.eyebrow {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 1.6px;
  text-transform: uppercase;
  color: var(--muted);
}
.meta {
  color: var(--muted);
  font-size: 12.5px;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 600;
  padding: 2px 9px;
  white-space: nowrap;
  background: var(--line);
  color: var(--ink2);
}
.pill.ok {
  background: var(--k-soft);
  color: var(--k-ink);
}
.pill.bad {
  background: var(--bad-soft);
  color: var(--bad);
}
.pill.chg {
  background: var(--o-soft);
  color: var(--o-ink);
}

.box {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  background: var(--raise);
}
.box h4 {
  margin: 0 0 6px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--muted);
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
}
.box ul {
  margin: 0;
  padding-left: 18px;
}
.row-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.scr {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  border-radius: 6px;
  padding: 1px 7px;
  background: var(--line);
  color: var(--ink2);
}
.scr.chg {
  background: var(--o-soft);
  color: var(--o-ink);
}
.scr.chg::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--o);
}

.seg {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.seg button {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 12.5px;
  color: var(--ink2);
}
.seg button[aria-pressed="true"] {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--win);
}
.seg .c {
  opacity: 0.65;
  margin-left: 4px;
}

.grp {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.grp-h {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
  padding-top: 4px;
}
.grp-h b {
  font-size: 14px;
}
.grp-h span {
  color: var(--muted);
  font-size: 12px;
}
.tc {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--raise);
}
.tc[open] {
  border-color: #3d3d3d;
}
.tc summary {
  list-style: none;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  cursor: pointer;
}
.tc summary::-webkit-details-marker {
  display: none;
}
.tid {
  font: 600 11px var(--mono);
  color: var(--muted);
  width: 22px;
  flex: none;
}
.tt {
  flex: 1;
  min-width: 0;
}
.tt .s {
  color: var(--muted);
  font-size: 12px;
}
.st {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 600;
  color: var(--faint);
}
.st.pass {
  color: var(--k-ink);
}
.st.fail {
  color: var(--bad);
}
.st .d {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  border: 1.5px solid currentColor;
}
.st.pass .d,
.st.fail .d {
  background: currentColor;
}
.tc-b {
  padding: 0 12px 12px 44px;
  display: grid;
  gap: 8px;
  font-size: 13px;
}
.tc-b h5,
.h5 {
  margin: 0;
  font-size: 10.5px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  font-weight: 700;
}
.tc-b ol {
  margin: 0;
  padding-left: 18px;
}
.upd {
  border: 1px solid var(--o-line);
  background: var(--o-soft);
  border-radius: 8px;
  padding: 8px 10px;
}
.upd .l {
  font: 11.5px/1.6 var(--mono);
  white-space: pre-wrap;
  word-break: break-word;
}
.upd .l.m {
  color: var(--bad);
}
.upd .l.p {
  color: var(--k-ink);
}
.tag-upd {
  font-size: 10px;
  font-weight: 700;
  color: var(--o-ink);
  background: var(--o-soft);
  border-radius: 4px;
  padding: 0 5px;
  margin-left: 6px;
}

.sum {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--raise);
}
.sum div {
  padding: 10px 14px;
  border-left: 1px solid var(--line);
}
.sum div:first-child {
  border-left: 0;
}
.sum b {
  display: block;
  font-size: 22px;
  letter-spacing: -0.5px;
  font-variant-numeric: tabular-nums;
}
.sum span {
  color: var(--muted);
  font-size: 12px;
}
.sum .p b {
  color: var(--k-ink);
}
.sum .f b {
  color: var(--bad);
}
.rr {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 12px;
  background: var(--raise);
}
.rr:hover {
  border-color: #444;
}
.rr.fail {
  border-color: var(--bad-line);
}
.rr .ms {
  color: var(--faint);
  font-size: 12px;
  width: 34px;
  text-align: right;
}
.rr .go {
  color: var(--faint);
}

.back {
  color: var(--muted);
  font-size: 13px;
  display: inline-flex;
  gap: 4px;
  align-items: center;
  align-self: flex-start;
}
.back:hover {
  color: var(--ink);
}
.cmp {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.cmp div {
  border-radius: 10px;
  padding: 10px 12px;
  background: var(--raise);
  border: 1px solid var(--line);
}
.cmp .act.bad {
  background: var(--bad-soft);
  border-color: var(--bad-line);
}
.cmp .act.ok {
  background: var(--k-soft);
  border-color: var(--k-line);
}
.steps {
  margin: 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 2px;
}
.steps li {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 5px 0;
}
.steps .k {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 10.5px;
  font-weight: 700;
  flex: none;
  margin-top: 1px;
  background: var(--k-soft);
  color: var(--k-ink);
}
.steps .k.bad {
  background: var(--bad);
  color: #1a1a1a;
}
.steps .k.skip {
  background: var(--line);
  color: var(--faint);
}
.steps .t {
  flex: 1;
}
.steps .tm {
  color: var(--faint);
  font: 11px var(--mono);
}
.ev {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.ev figure {
  margin: 0;
  display: grid;
  gap: 4px;
}
.ev figcaption {
  color: var(--muted);
  font-size: 11.5px;
  display: flex;
  justify-content: space-between;
}
.cause {
  border-left: 3px solid var(--bad);
  padding: 6px 12px;
  background: var(--raise);
  border-radius: 0 8px 8px 0;
}
.cause .mono {
  color: var(--ink2);
}
.acts {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}
.btn {
  border: 1px solid #3d3d3d;
  border-radius: 10px;
  padding: 7px 14px;
  font-weight: 600;
  font-size: 13.5px;
  background: var(--raise2);
  white-space: nowrap;
}
.btn:hover {
  background: #333;
}
.btn.pri {
  background: var(--ink);
  border-color: var(--ink);
  color: #161616;
}
.btn.pri:hover {
  background: #fff;
}
.btn.link {
  border: 0;
  background: none;
  color: var(--k-ink);
  padding: 7px 2px;
}
.btn:disabled {
  opacity: 0.45;
  cursor: default;
}

/* evidence: a light screenshot of the app under test */
.shot {
  position: relative;
  aspect-ratio: 16 / 11;
  max-width: 100%;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  background: #fbfaf7;
  font-size: 8.5px;
  line-height: 1.35;
  color: #2d332f;
}
.shot .nav {
  background: var(--shop);
  color: #e8efe9;
  padding: 4px 7px;
  display: flex;
  justify-content: space-between;
  font-weight: 700;
  letter-spacing: 0.2px;
}
.shot .in {
  padding: 6px 8px;
  display: grid;
  gap: 4px;
}
.shot .ln {
  display: flex;
  justify-content: space-between;
  padding: 1px 3px;
  border-radius: 3px;
}
.shot .tot {
  font-weight: 700;
  border-top: 1px solid #ddd;
  padding-top: 3px;
}
.shot .fld {
  border: 1px solid #cfd3cf;
  border-radius: 3px;
  padding: 2px 4px;
  background: #fff;
  display: flex;
  justify-content: space-between;
}
.shot .ap {
  background: var(--shop);
  color: #fff;
  border-radius: 3px;
  padding: 0 5px;
}
.shot .hl {
  outline: 1.5px solid #c13a2d;
  background: rgba(193, 58, 45, 0.08);
}
.shot .hlok {
  outline: 1.5px solid #0f8a5f;
  background: rgba(15, 138, 95, 0.08);
}
.shot .ttl {
  font-weight: 700;
  font-size: 10px;
}
.shot .err {
  color: #c13a2d;
}
.shot .cur {
  position: absolute;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: rgba(242, 140, 40, 0.55);
  border: 2px solid var(--o);
  transform: translate(-50%, -50%);
  transition:
    left 0.5s,
    top 0.5s;
}
.vid {
  position: relative;
}
.vid .play {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
}
.vid .play span {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: rgba(20, 20, 20, 0.8);
  display: grid;
  place-items: center;
  color: #fff;
}
.vid .cap {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(20, 20, 20, 0.85);
  color: #fff;
  font-size: 10px;
  padding: 3px 7px;
}
.vid .prog {
  position: absolute;
  left: 0;
  bottom: 0;
  height: 2px;
  background: var(--o);
  transition: width 0.3s;
}

/* app map */
.map-tools {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.map-tools select {
  appearance: none;
  -webkit-appearance: none;
  height: 32px;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0 36px 0 12px;
  background: var(--raise2);
  max-width: 100%;
  cursor: pointer;
}
.map-tools select:hover {
  border-color: #444;
}
.sel-wrap {
  position: relative;
  display: inline-flex;
  max-width: 100%;
}
.sel-wrap::after {
  content: "";
  position: absolute;
  right: 14px;
  top: 50%;
  width: 6px;
  height: 6px;
  margin-top: -5px;
  border-right: 1.6px solid var(--muted);
  border-bottom: 1.6px solid var(--muted);
  transform: rotate(45deg);
  pointer-events: none;
}
body.light .map-tools select:hover {
  border-color: #c4c4c4;
}
.legend {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  color: var(--muted);
  font-size: 12px;
}
.legend i {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  margin-right: 5px;
  vertical-align: -1px;
}
.map-scroll {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 12px;
  background:
    radial-gradient(circle, #2c2c2c 1px, transparent 1.2px) 0 0 / 16px 16px,
    #191919;
}
.map {
  position: relative;
  width: 540px;
  height: 392px;
  margin: 0 auto;
}
.map svg.edges {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}
.node {
  position: absolute;
  width: 108px;
  height: 92px;
  border: 1px solid #3a3a3a;
  border-radius: 10px;
  background: var(--raise);
  text-align: left;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition:
    box-shadow 0.15s,
    opacity 0.2s;
}
.node:hover {
  border-color: #555;
}
.node.chg {
  border-color: var(--o);
}
.node.pass {
  box-shadow: 0 0 0 2px var(--k-ink);
}
.node.fail {
  box-shadow: 0 0 0 2px var(--bad);
}
.node.sel {
  box-shadow: 0 0 0 2px var(--ink);
}
.node.dim {
  opacity: 0.32;
}
.node .th {
  flex: 1;
  border-radius: 5px;
  background: #2b2b2b;
  padding: 4px;
  display: grid;
  gap: 2px;
  align-content: start;
  overflow: hidden;
}
.node .th i {
  display: block;
  height: 4px;
  border-radius: 2px;
  background: #3d3d3d;
}
.node .th i.h {
  background: #556b60;
  height: 5px;
}
.node .th i.a {
  background: rgba(95, 211, 160, 0.45);
}
.node .th .g {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2px;
}
.node .th .g i {
  height: 12px;
}
.node .nm {
  font-size: 11px;
  font-weight: 600;
  line-height: 1.2;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.node .bd {
  position: absolute;
  top: -8px;

}

/* v10 key values */
#ptabs {
  padding: 0 14px;
  flex: none;
}
.vtabs .cnt.ok {
  background: var(--k-soft);
  color: var(--k-ink);
}
.kv {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--raise);
}
.kv.k3 {
  grid-template-columns: repeat(3, minmax(0, 1fr));
}
.kv > div {
  padding: 10px 12px;
  border-left: 1px solid var(--line);
  min-width: 0;
}
.kv > div:first-child {
  border-left: 0;
}
.kv b {
  display: block;
  font-size: 19px;
  font-weight: 650;
  letter-spacing: -0.4px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.kv span {
  display: block;
  color: var(--muted);
  font-size: 11.5px;
  line-height: 1.3;
}
.kv .good b {
  color: var(--k-ink);
}
.kv .bad b {
  color: var(--bad);
}
.kv .chgv b {
  color: var(--o-ink);
}
.kc .parts {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  font-size: 12.5px;
  color: var(--muted);
  margin: 3px 0 1px;
}
.kc .parts b {
  color: var(--ink);
  font-weight: 650;
}
.cov {
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--side);
}
.cov summary {
  list-style: none;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  cursor: pointer;
  font-size: 13px;
}
.cov summary::-webkit-details-marker {
  display: none;
}
/* expand / collapse chevron on every row that opens */
.cov summary::after,
.tc summary::after {
  content: "";
  flex: none;
  width: 7px;
  height: 7px;
  margin: -4px 4px 0 2px;
  border-right: 1.8px solid var(--muted);
  border-bottom: 1.8px solid var(--muted);
  transform: rotate(45deg);
  transition:
    transform 0.15s,
    margin 0.15s;
}
.cov[open] > summary::after,
.tc[open] > summary::after {
  transform: rotate(-135deg);
  margin-top: 4px;
}
.cov summary:hover::after,
.tc summary:hover::after {
  border-color: var(--ink);
}
.cov summary > span:last-of-type {
  margin-left: auto;
}
.ok-t {
  color: var(--k-ink);
  font-weight: 600;
  font-size: 12.5px;
  white-space: nowrap;
}
.bad-t {
  color: var(--bad);
  font-weight: 600;
  font-size: 12.5px;
  white-space: nowrap;
}
.cov-row {

}
.cov-row .tt.mono {

}
.ids {

}
.idc {

}
.idc:hover {

}
.idc.pass {
  border-color: var(--k-line);

}
.idc.fail {
  border-color: var(--bad-line);

}
.fcard {
  display: grid;
  gap: 8px;

  text-align: left;
  border: 1px solid var(--bad-line);
  border-radius: 12px;
  padding: 10px 12px;

}
.fcard:hover {

}
.fc-top {

}
.fc-vals {

}
.fc-vals > div {

}

}
.lbl {

.rbar {

}

}
.chg-sum {

}

/* v11 coverage map, status icons and IDs */
.map {
  width: 540px;

}
.node {
  width: 104px;
  height: 104px;
  gap: 3px;
}
.node.chg {

}

}
.legend .lg-n {

}
.tidc {

}
.rr .tidc,
.tc .tidc,
.fcard .tidc {

}
.tc-b {

}
.steps li {

}
.steps .sico {

}

}
.sid {
  font: 600 11px var(--mono);
  color: var(--muted);

}

/* v14 one status indicator */

}

}

.tag-chg {

.node.chg {

/* v15 next-step card (replaces the always-on chips) */
.ask.next {

}
.nx-x {

.nx-acts {

.nx-pri {

.nx-pri:hover {

}
.nx-pri .kbd:first-of-type {

}
.kbd {
  font-size: 11px;
  line-height: 16px;
  min-width: 18px;

.nx-sec {

/* v16 audit fixes */
.map {
  transform-origin: top left;
}
.node.sel {
  box-shadow: none;
  outline: 2px solid var(--ink);
  outline-offset: 3px;
}
.node.sel.pass {
  box-shadow: 0 0 0 1.5px var(--k-ink);
}
.node.sel.fail {
  box-shadow: 0 0 0 2px var(--bad);
}
.node.sel.plan {
  box-shadow: 0 0 0 1.5px #6a6a6a;
}
span.tb-btn {
  cursor: default;
}
span.tb-btn:hover {
  background: none;
  color: var(--muted);
}
.sw:disabled,
button.tb-btn:disabled {
  opacity: 0.35;
  cursor: default;
}
button.tb-btn:disabled:hover {
  background: none;
  color: var(--muted);
}
.sw:disabled:hover {
  background: none;
  color: var(--muted);
}
.cp-flow b {
  font-weight: 700;
  margin-right: 4px;
}
/* changed screens keep an orange outline; a failure still wins with red */
.node.chg {
  border-color: var(--o);
}
.node.chg.pass,
.node.sel.chg.pass {
  box-shadow: 0 0 0 2px var(--o);
}
.node.chg.plan,
.node.sel.chg.plan {

}
.node.chg.none {
  border: 1.5px dashed var(--o);
}
.node.chg.fail,
.node.sel.chg.fail {
  box-shadow: 0 0 0 2px var(--bad);
  border-color: var(--bad);
}
.cp-flow span.pass b {
  color: var(--k-ink);
}
.cp-flow span.fail b {
  color: var(--bad);
}

/* plan groups fold in the All view */
.grp-d {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--side);
}
.grp-d > summary {
  list-style: none;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  cursor: pointer;
  white-space: nowrap;
}
.grp-d > summary::-webkit-details-marker {
  display: none;
}
.grp-d > summary b {
  font-size: 14px;
}
.grp-b .gs-sub {
  color: var(--muted);
  font-size: 12px;
  padding: 0 2px 2px;
}
.grp-d > summary .gs-r {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12.5px;
}
.grp-d > summary .gs-n {
  color: var(--muted);
  font-size: 12.5px;
}
.grp-d > summary::after {
  content: "";
  flex: none;
  width: 7px;
  height: 7px;
  margin: -4px 4px 0 2px;
  border-right: 1.8px solid var(--muted);
  border-bottom: 1.8px solid var(--muted);
  transform: rotate(45deg);
  transition:
    transform 0.15s,
    margin 0.15s;
}
.grp-d[open] > summary::after {
  transform: rotate(-135deg);
  margin-top: 4px;
}
.grp-d > summary:hover::after {
  border-color: var(--ink);
}
.grp-d[open] > summary {
  border-bottom: 1px solid var(--line);
}
.grp-b {
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
/* compact test list: the group is the card and each test is one line; screen, steps and file sit in the expanded row */
.grp-d > summary .gs-n {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.grp-b {
  padding: 0;
  gap: 0;
}
.grp-b .tc {
  border: 0;
  border-top: 1px solid var(--line2);
  border-radius: 0;
  background: none;
}
.grp-b .tc:first-child {
  border-top: 0;
}
.grp-b .tc:last-child {
  border-radius: 0 0 12px 12px;
}
.grp-b .tc[open] {
  background: var(--raise);
}
.grp-b .tc summary {
  padding: 8px 12px;
  gap: 8px;
  min-height: 38px;
}
.grp-b .tc .tt {
  font-size: 13px;
  line-height: 1.35;
}
.grp-b .tc .ms {
  color: var(--muted);
  font-size: 12px;
  flex: none;
}
.grp-b .tc-b {
  padding: 0 12px 12px;
}
.t-info {
  color: var(--muted);
  font-size: 12px;
}

/* resizable side panel */
.panel {
  position: relative;
}
.p-resize {
  position: absolute;
  top: 0;
  bottom: 0;
  left: -4px;
  width: 8px;
  cursor: col-resize;
  z-index: 3;
  touch-action: none;
}
.p-resize::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 3px;
  width: 2px;
  background: transparent;
  transition: background 0.15s;
}
.p-resize:hover::after,
.p-resize:focus-visible::after,
body.resizing .p-resize::after {
  background: var(--blue);
}
.p-resize:focus-visible {
  outline: none;
}
body.resizing {
  cursor: col-resize;
  user-select: none;
}
body.resizing .shell {
  pointer-events: none;
}
body.resizing .p-resize {
  pointer-events: auto;
}
button.tb-btn[aria-pressed="true"] {
  color: var(--ink);
  background: var(--line2);
}

/* live work on the map */
.livebar {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid rgba(74, 134, 240, 0.45);
  background: rgba(74, 134, 240, 0.1);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 13px;
}
.livebar .tt {
  flex: 1;
  min-width: 0;
}
.livebar .n {
  color: var(--muted);
  font-size: 12px;
}
.livebar .spin {
  border-color: rgba(74, 134, 240, 0.3);
  border-top-color: var(--blue);
}
.lbar {
  height: 3px;
  border-radius: 2px;
  background: var(--line);
  overflow: hidden;
  margin-top: -10px;
}
.lbar i {
  display: block;
  height: 100%;
  background: var(--blue);
  transition: width 0.3s;
}
.node.scan {
  outline: 2px solid var(--blue);
  outline-offset: 3px;
  animation: scanp 1.1s ease-in-out infinite;
}
@keyframes scanp {
  50% {
    outline-color: rgba(74, 134, 240, 0.2);
  }
}
.map svg line.flow {
  stroke-dasharray: 7 5;
  animation: flowd 0.7s linear infinite;
}
@keyframes flowd {
  to {
    stroke-dashoffset: -12;
  }
}

/* light theme: ChatGPT desktop light, same layout */
body.light {
  --chrome: #f3f3f3;
  --win: #ffffff;
  --side: #f9f9f9;
  --raise: #f4f4f4;
  --raise2: #ffffff;
  --line: #e3e3e3;
  --line2: #ececec;
  --ink: #0d0d0d;
  --ink2: #3d3d3d;
  --muted: #6b6b6b;
  --faint: #9b9b9b;
  --bubble: #f0f0f0;
  --blue: #3b78e7;
  --k-ink: #0b7a52;

}
