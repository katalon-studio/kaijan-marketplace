<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Kaijan feedback</title>
    <style>
      /* Existing selected Codex .ask.fbc spacing, typography and card controls. */
:root {
  color-scheme: light dark;
  --ink: var(--color-text-primary, #242424);
  --muted: var(--color-text-secondary, #666);
  --card-line: var(--color-border-secondary, #e6e6e6);
  --win: var(--color-background-primary, #fff);
  --line2: var(--color-background-secondary, #f5f5f5);
  --blue: #4a86f0;
  font-family: var(
    --font-sans,
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    "Segoe UI",
    sans-serif
  );
  font-size: 13px;
}
:root[data-theme="dark"] {
  --ink: var(--color-text-primary, #eee);
  --muted: var(--color-text-secondary, #aaa);
  --card-line: var(--color-border-secondary, #444);
  --win: var(--color-background-primary, #242424);
  --line2: var(--color-background-secondary, #303030);
}
* {
  box-sizing: border-box;
}
[hidden] {
  display: none !important;
}
body {
  margin: 0;
  color: var(--ink);
  background: transparent;
}
button,
input,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: default;
  opacity: 0.55;
}
:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
.ask.fbc {
  padding: 10px 10px 12px 14px;
  display: grid;
  gap: 9px;
  border: 1px solid var(--card-line);
  border-radius: 19px;
  background: var(--win);
}
.fbc-top {
  display: flex;
  align-items: center;
  gap: 8px;
}
.fbc-q {
  flex: 1;
  min-width: 0;
  margin: 0;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.4;
}
#status,
#delivery {
  margin: 0;
  color: var(--muted);
  line-height: 1.5;
}
form {
  display: grid;
  gap: 8px;
}
label {
  font-size: 13px;
  font-weight: 500;
}
input,
textarea {
  width: 100%;
  min-width: 0;
  border: 1px solid var(--card-line);
  border-radius: 8px;
  background: var(--win);
  padding: 9px 10px;
  line-height: 1.5;
}
textarea {
  resize: vertical;
  min-height: 104px;
  max-height: 320px;
}
.field-note {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: space-between;
  color: var(--muted);
  font-size: 12px;
}
.actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 6px;
}
button {
  min-height: 28px;
  padding: 5px 12px;
  border: 1px solid var(--card-line);
  border-radius: 999px;
  background: var(--win);
}
button:hover:not(:disabled) {
  background: var(--line2);
}
.primary {
  background: var(--ink);
  color: var(--win);
}
.primary:hover:not(:disabled) {
  opacity: 0.85;
  background: var(--ink);
}
#conflict {
  padding: 10px;
  border: 1px solid var(--card-line);
  border-radius: 8px;
}
#conflict p {
  margin: 0 0 8px;
  line-height: 1.5;
}
#current-text {
  max-height: 160px;
  overflow: auto;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font: inherit;
  margin: 0 0 10px;
}

    </style>
  </head>

        <h1 id="heading" class="fbc-q">Kaijan feedback</h1>
      </header>
      <p id="status" role="status" aria-live="polite">Opening feedback…</p>
      <form id="form" hidden>
        <label for="title">Title</label
        ><input id="title" maxlength="200" autocomplete="off" /><label
          for="description"
          >Feedback</label
        ><textarea
          id="description"
          rows="5"
          maxlength="5000"
          placeholder="Share feedback about Kaijan"
        ></textarea>
        <div class="field-note">
          <span id="origin"></span><span id="count"></span>
        </div>
        <section id="conflict" hidden aria-label="Changed feedback">
          <p>
            The feedback changed in chat. Review the saved text before saving
            your edit.
          </p>
          <pre id="current-text"></pre>
          <div class="actions">
            <button id="use-current" type="button">Use saved text</button
            ><button id="keep-edit" type="button">Save my edit</button>
          </div>
        </section>
        <p id="delivery">Private feedback to Kaijan.</p>
        <footer class="actions">
          <button id="skip" type="button">Not now</button
          ><button
            id="send"
            type="submit"
            class="primary"
            aria-describedby="delivery"
          >
            Send
          </button>
        </footer>
      </form>
    </section>
