    <style>
      /* Selected 2 Nov design at 28d931c, adapted to native disclosures and supplied
 * report data. The approved README corrections own the three-column Runs view. */
:root {
  --sans:
    -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto,
    Helvetica, Arial, sans-serif;
  --blue: #4a86f0;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
select,
summary {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  background: none;
  border: 0;
  padding: 0;
}
button:disabled {
  cursor: default;
}
summary {
  cursor: pointer;
  list-style: none;
}
summary::-webkit-details-marker {
  display: none;
}
:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
svg.i {
  width: 17px;
  height: 17px;
  flex: none;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}
svg.i.sm {
  width: 14px;
  height: 14px;
  stroke-width: 1.8;
}
body.light {
  --blue: #3b78e7;
}
.num {
  font-variant-numeric: tabular-nums;
}
.ring {
  --v: 0;
  --rc: var(--k-ink);
  --rbg: var(--raise2);
  width: 54px;
  height: 54px;
  border-radius: 50%;
  flex: none;
  display: grid;
  place-items: center;
  position: relative;
  background: conic-gradient(var(--rc) calc(var(--v) * 1%), var(--line) 0);
}
.ring::before {
  content: "";
  position: absolute;
  inset: 5px;
  border-radius: 50%;
  background: var(--rbg);
}
.ring b {
  position: relative;
  font: 700 18px/1 var(--sans);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.4px;
}
.dz {
  --bg: #0d1117;
  --pn: #0d1117;
  --pn2: #151b23;
  --ln: #3d444d;
  --ln2: #4b535d;
  --ink: #f0f6fc;
  --ink2: #d1d7e0;
  --ink3: #9198a1;
  --g: #3fb950;
  --gbtn: #238636;
  --gon: #ffffff;
  --gs: #12261e;
  --bad: #f85149;
  --bads: #25171c;
  --o: #f0883e;
  --os: #2b1d12;
  --lnk: #4493f8;
  --side: #010409;
  --hov: #262c36;
  --line: var(--ln);
  --raise2: var(--pn);
  --k-ink: var(--g);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font:
    14px/1.5 -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans",
    Helvetica,
    Arial,
    sans-serif;
}
body.light .dz {
  --bg: #ffffff;
  --pn: #ffffff;
  --pn2: #f6f8fa;
  --ln: #d1d9e0;
  --ln2: #c3ccd5;
  --ink: #1f2328;
  --ink2: #3d444d;
  --ink3: #59636e;
  --g: #1a7f37;
  --gbtn: #1f883d;
  --gon: #ffffff;
  --gs: #dafbe1;
  --bad: #d1242f;
  --bads: #ffebe9;
  --o: #953800;
  --os: #fff1e5;
  --lnk: #0969da;
  --side: #f6f8fa;
  --hov: #eaeef2;
}
.dz .mono {
  font-family: var(--mono);
  font-size: 12px;
}
.dz .add {
  color: var(--g);
}
.dz .del {
  color: var(--bad);
}
.dz .bad {
  color: var(--bad);
}
.dz .ok {
  color: var(--g);
}
.dz .mut {
  color: var(--ink3);
}
.dz-top {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 18px;
  height: 52px;
  padding: 0 20px;
  background: var(--pn);
  border-bottom: 1px solid var(--ln);
}
.dz-brand {
  display: flex;
  align-items: center;
  gap: 8px;
}
.dz-brand img {
  width: 24px;
  height: 24px;
}
.dz-brand .k-word {
  font-size: 17px;
}
.dz-ws {
  color: var(--ink2);
  font-size: 13.5px;
  white-space: nowrap;
}
.dz-ws i {
  color: var(--ink3);
  font-style: normal;
  padding: 0 3px;
}
.dz-nav {
  display: flex;
  gap: 2px;
  margin-left: 8px;
}
.dz-nav span,
.dz-nav button {
  padding: 6px 10px;
  border-radius: 8px;
  color: var(--ink3);
  font-size: 13.5px;
  font-weight: 500;
  white-space: nowrap;
}
.dz-nav .on {
  color: var(--ink);
  background: var(--gs);
}
.dz-top .sp {
  flex: 1;
}
.dz-av {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--gs);
  color: var(--g);
  font-size: 12px;
  font-weight: 700;
  flex: none;
}
.dz-av.sm {
  width: 26px;
  height: 26px;
  font-size: 10.5px;
}
.dz-wrap {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 24px;
  padding: 18px 24px 40px;
  max-width: 980px;
  margin: 0 auto;
}
.dz-main {
  min-width: 0;
  display: grid;
  gap: 22px;
  align-content: start;
}
.dz-back {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  color: var(--ink3);
  margin: -4px 0 -6px;
  font-size: 14px;
  width: max-content;
}
.dz-back[hidden] {
  display: none;
}
.dz-back svg {
  width: 16px;
  height: 16px;
}
button.dz-back:hover {
  color: var(--ink);
}
.dz-wrap.one {
  grid-template-columns: minmax(0, 1fr);
  max-width: 900px;
}
.dz-title {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: -6px;
}
.dz-title h1 {
  font-size: 24px;
  line-height: 1.2;
  letter-spacing: -0.6px;
  margin: 0;
  font-weight: 700;
}
.dz-title h1 span {

.dz-ln {

@container (max-width: 980px) {
  .dz-wrap {
    grid-template-columns: 1fr;
    padding: 16px 20px 32px;

  .dz-side {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .dz-nav,
  .dz-ws {
    display: none;
  }
}
@container (max-width: 700px) {
  .dz-side {
    grid-template-columns: 1fr;
  }
  .dz-sc,
  .dz-det {
    grid-template-columns: 1fr;
  }
  .dz-parts {
    border-left: 0;
    padding-left: 0;
  }
  .dz-det {
    padding-left: 14px;
  }
  .dz-rh {
    grid-template-columns: 20px var(--test-id-width, 28px) minmax(0, 1fr) 16px;
  }
  .dz-rs,
  .dz-du {
    display: none;
  }
  .dz-rh:has(> .dz-check-status) {
    grid-template-columns:
      20px var(--test-id-width, 28px) minmax(0, 1fr)
      var(--test-status-width) 16px;
  }
  .dz-rh > .dz-check-status {
    display: block;
    text-align: right;
    white-space: normal;
  }
  .dz-q {
    margin-left: 0;
  }
}

.dz-dl {

}
.dz-id {

.dz-cmp b,
.dz-steps,

.dz-back.placeholder {

.dz-code {

.dz-code .code-text {

}
.trace-controls button:focus-visible,
.trace-launch:focus-visible {
  outline: 2px solid var(--ink, CanvasText);
  outline-offset: 3px;
}
.trace-controls button:disabled {
  opacity: 0.6;
  cursor: wait;
}
.trace-launch {
  display: block;
  margin-top: 8px;
}
.trace-launch[hidden] {
  display: none;
}

.dz-tbl > .trace-controls {
  margin: 0;
  padding: 12px 14px;
  border-top: 1px solid var(--ln, currentColor);
}
.trace-unavailable {
  display: block;
  font-size: 11px;
  margin-top: 6px;
}

.case-evidence {
  margin-block: 0;
  min-width: 0;
}
.case-evidence > button {
  padding: 6px 10px;
  border: 1px solid var(--ln, #888);
  border-radius: 6px;
  background: transparent;
  color: inherit;
  cursor: pointer;
}
.case-screenshot {
  display: block;
  width: 100%;
  height: auto;
  border: 1px solid var(--ln, #888);
}
.dz-det:has(.case-evidence) {
  grid-template-columns: minmax(0, 1fr);
}
.dz-media:has(.case-evidence) {
  width: 100%;
  max-width: none;
}

.case-evidence-header,
.case-gallery-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px 16px;
}
.case-evidence-header h3 {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
}
.case-evidence-header .trace-controls {
  margin: 0;
  justify-content: flex-end;
}
.case-evidence-header .trace-controls p {
  margin: 0;
  text-align: right;
}
.case-gallery {
  margin-top: 16px;
}
.case-gallery-toolbar {
  margin-bottom: 8px;
  font-size: 12px;
  color: var(--ink3, var(--muted, CanvasText));
}
.case-gallery select {
  max-width: 100%;
  padding: 6px 8px;
  font: inherit;
  color: var(--ink, CanvasText);
  background: var(--pn2, var(--raise, Canvas));
  border: 1px solid var(--ln, #888);
  border-radius: 6px;
}
.case-screenshot {
  border-radius: 8px;
}
.dz-det:has([data-case-evidence]) {
  grid-template-columns: minmax(0, 1fr);
}
.dz-media:has([data-case-evidence]) {
  width: 100%;
  max-width: none;
}

.dz-media:has([data-case-evidence]) > .dz-note {
  margin: 0;
  font-size: 12px;
}
.case-evidence-header h3 {
  padding: 0;
  background: none;
  border: 0;
}
.case-evidence-header {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
}
.case-evidence-header .trace-controls {
  max-width: 240px;
}

.case-gallery-toolbar .trace-controls {
  margin: 0 0 0 auto;
  justify-content: flex-end;
}
.case-gallery-toolbar .trace-controls p {
  margin: 0;
  text-align: right;
}

.kj-feedback-entry {
  border-top: 1px solid var(--card-line);
  padding: 10px 18px;
  color: var(--ink2);
  font-size: 12px;
  line-height: 1.5;
}
.kj-feedback-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 18px;
}
.kj-feedback-actions button {
  color: var(--muted);
  text-decoration: underline;
  text-underline-offset: 3px;
}
.kj-feedback-actions button:hover {
  color: var(--ink);
}
.kj-feedback-actions button:disabled {
  opacity: 0.65;
}
.kj-feedback-entry [hidden] {
  display: none;
}
.kj-feedback-status {
  margin: 8px 0 0;
  overflow-wrap: anywhere;
}

.kj-configurations {
  font: 14px/1.5 var(--font-sans, system-ui, sans-serif);
  color: var(--color-text-primary, #252525);
  background: var(--color-background-primary, #fff);
  padding: 16px;
  max-width: 760px;
  margin: auto;
  box-sizing: border-box;
}
.kj-configurations * {
  box-sizing: border-box;
}
.kj-configurations .kj-config-field {
  min-width: 0;
}
:root[data-theme="dark"] .kj-configurations {
  color: var(--color-text-primary, #eee);
  background: var(--color-background-primary, #242424);
}
.kj-configurations [hidden],
.kj-configurations[hidden] {
  display: none !important;
}
.kj-configurations h2 {
  margin: 0 0 8px;
  font-size: 20px;
}
.kj-configurations p {
  margin: 8px 0;
}
.kj-configurations label {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
  margin: 8px 0;
}
.kj-configurations input,
.kj-configurations select,
.kj-configurations button {
  font: inherit;
  border: 1px solid #8887;
  border-radius: 6px;
  padding: 8px;
  color: inherit;
  background: transparent;
  max-width: 100%;
}
.kj-configurations input,
.kj-configurations select {
  width: 100%;
}
.kj-configurations input[type="checkbox"] {
  width: 20px;
  height: 20px;
}
.kj-configurations button {
  cursor: pointer;
  margin: 4px 8px 4px 0;
}
.kj-configurations button:disabled {
  opacity: 0.5;
  cursor: default;
}
.kj-configurations button[type="submit"] {
  background: #237344;
  color: #fff;
}
.kj-configurations .kj-config-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 100px minmax(0, 1fr) 50px;
  align-items: end;
  gap: 8px;
  border: 1px solid #8885;
  border-radius: 8px;
  padding: 10px;
  margin: 12px 0;
  min-width: 0;
}
.kj-configurations .kj-config-row button {
  grid-column: 1/-1;
  justify-self: start;
}
.kj-configurations .kj-config-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
}
.kj-configurations .kj-config-actions select {
  flex: 1 1 180px;
}
@media (max-width: 600px) {
  .kj-configurations .kj-config-row {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  }
}
