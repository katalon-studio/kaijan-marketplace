    <style>
      /* Selected 2 Nov design at 28d931c, adapted to native disclosures and supplied
 * report data. The approved README corrections own the three-column Runs view. */
:root {
  --sans:
    -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto,
    Helvetica, Arial, sans-serif;
  --blue: #4a86f0;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
select,
summary {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  background: none;
  border: 0;
  padding: 0;
}
button:disabled {
  cursor: default;
}
summary {
  cursor: pointer;
  list-style: none;
}
summary::-webkit-details-marker {
  display: none;
}
:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
svg.i {
  width: 17px;
  height: 17px;
  flex: none;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}
svg.i.sm {
  width: 14px;
  height: 14px;
  stroke-width: 1.8;
}
body.light {
  --blue: #3b78e7;
}
.num {
  font-variant-numeric: tabular-nums;
}
.ring {
  --v: 0;
  --rc: var(--k-ink);
  --rbg: var(--raise2);
  width: 54px;
  height: 54px;
  border-radius: 50%;
  flex: none;
  display: grid;
  place-items: center;
  position: relative;
  background: conic-gradient(var(--rc) calc(var(--v) * 1%), var(--line) 0);
}
.ring::before {
  content: "";
  position: absolute;
  inset: 5px;
  border-radius: 50%;
  background: var(--rbg);
}
.ring b {
  position: relative;
  font: 700 18px/1 var(--sans);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.4px;
}
.dz {
  --bg: #0d1117;
  --pn: #0d1117;
  --pn2: #151b23;
  --ln: #3d444d;
  --ln2: #4b535d;
  --ink: #f0f6fc;
  --ink2: #d1d7e0;
  --ink3: #9198a1;
  --g: #3fb950;
  --gbtn: #238636;
  --gon: #ffffff;
  --gs: #12261e;
  --bad: #f85149;
  --bads: #25171c;
  --o: #f0883e;
  --os: #2b1d12;
  --lnk: #4493f8;
  --side: #010409;
  --hov: #262c36;
  --line: var(--ln);
  --raise2: var(--pn);
  --k-ink: var(--g);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font:
    14px/1.5 -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans",
    Helvetica,
    Arial,
    sans-serif;
}
body.light .dz {
  --bg: #ffffff;
  --pn: #ffffff;
  --pn2: #f6f8fa;
  --ln: #d1d9e0;
  --ln2: #c3ccd5;
  --ink: #1f2328;
  --ink2: #3d444d;
  --ink3: #59636e;
  --g: #1a7f37;
  --gbtn: #1f883d;
  --gon: #ffffff;
  --gs: #dafbe1;
  --bad: #d1242f;
  --bads: #ffebe9;
  --o: #953800;
  --os: #fff1e5;
  --lnk: #0969da;
  --side: #f6f8fa;
  --hov: #eaeef2;
}
.dz .mono {
  font-family: var(--mono);
  font-size: 12px;
}
.dz .add {
  color: var(--g);
}
.dz .del {
  color: var(--bad);
}
.dz .bad {
  color: var(--bad);
}
.dz .ok {
  color: var(--g);
}
.dz .mut {
  color: var(--ink3);
}
.dz-top {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 18px;
  height: 52px;
  padding: 0 20px;
  background: var(--pn);
  border-bottom: 1px solid var(--ln);
}
.dz-brand {
  display: flex;
  align-items: center;
  gap: 8px;
}
.dz-brand img {
  width: 24px;
  height: 24px;
}
.dz-brand .k-word {
  font-size: 17px;
}
.dz-ws {
  color: var(--ink2);
  font-size: 13.5px;
  white-space: nowrap;
}
.dz-ws i {
  color: var(--ink3);
  font-style: normal;
  padding: 0 3px;
}
.dz-nav {
  display: flex;
  gap: 2px;
  margin-left: 8px;
}
.dz-nav span,
.dz-nav button {
  padding: 6px 10px;
  border-radius: 8px;
  color: var(--ink3);
  font-size: 13.5px;
  font-weight: 500;
  white-space: nowrap;
}
.dz-nav .on {
  color: var(--ink);
  background: var(--gs);
}
.dz-top .sp {
  flex: 1;
}
.dz-av {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--gs);
  color: var(--g);
  font-size: 12px;
  font-weight: 700;
  flex: none;
}
.dz-av.sm {
  width: 26px;
  height: 26px;
  font-size: 10.5px;
}
.dz-wrap {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 24px;
  padding: 18px 24px 40px;
  max-width: 980px;
  margin: 0 auto;
}
.dz-main {
  min-width: 0;
  display: grid;
  gap: 22px;
  align-content: start;
}
.dz-back {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  color: var(--ink3);
  margin: -4px 0 -6px;
  font-size: 14px;
  width: max-content;
}
.dz-back[hidden] {
  display: none;
}
.dz-back svg {
  width: 16px;
  height: 16px;
}
button.dz-back:hover {
  color: var(--ink);
}
.dz-wrap.one {
  grid-template-columns: minmax(0, 1fr);
  max-width: 900px;
}
.dz-title {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: -6px;
}
.dz-title h1 {
  font-size: 24px;
  line-height: 1.2;
  letter-spacing: -0.6px;
  margin: 0;
  font-weight: 700;
}
.dz-title h1 span {

}
.dz-title .sp {

}
.dz-title .dz-btn {

}

  height: 14px;
}
.dz-parts {

.dz-pb i {

.dz-parts b {

.dz-sec h2 {

}
.dz-sec h2 span {

.dz-gh {

}

.dz-sec > .dz-row {

.dz-rh {
  display: grid;

.dz-si {

.dz-si.pass {
  background: none;
  color: var(--g);

}
.dz-si.fail {
  background: none;
  color: var(--bad);
  box-shadow: none;
}
.dz-si.run {
  box-shadow: none;
}
.dz-si svg.i.sm {
  width: 14px;
  height: 14px;
  stroke-width: 2.4;
}
.dz-si .spin {
  width: 14px;
  height: 14px;
  border-color: var(--ln2);
  border-top-color: var(--g);
}
.dz-id {
  color: var(--ink3);
}
.dz-tt {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dz-tt em {
  font-style: normal;
  font-size: 11.5px;
  color: var(--o);
  background: var(--os);
  border-radius: 5px;
  padding: 1px 6px;
  margin-left: 8px;
}
.dz-rs {
  color: var(--ink3);
  font-size: 12.5px;
  white-space: nowrap;
}
.dz-rs.bad {
  color: var(--bad);
  font-weight: 600;
}
.dz-rs.ok {
  color: var(--g);
  font-weight: 600;
}
.dz-du {
  color: var(--ink3);
  text-align: right;
}
.dz-det {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 260px;
  gap: 18px;
  padding: 4px 14px 16px 52px;
}
.dz-dl {
  display: grid;
  gap: 10px;
  align-content: start;
  font-size: 13px;
  min-width: 0;
}
.dz-dl p {

}
.dz-cmp {

}

  border-radius: 9px;
  padding: 8px 10px;
}
.dz-cmp div.bad {
  border-color: color-mix(in srgb, var(--bad) 45%, transparent);
  background: var(--bads);
  color: inherit;
}
.dz-cmp div.ok {
  border-color: color-mix(in srgb, var(--g) 45%, transparent);
  background: var(--gs);
  color: inherit;
}
.dz-cmp span {
  display: block;
  color: var(--ink3);
  font-size: 11.5px;
}
.dz-cmp b {
  font-weight: 600;
}
.dz-note {
  color: var(--ink2);
}
.dz-steps {
  margin: 0;
  padding-left: 18px;
  color: var(--ink2);
  display: grid;
  gap: 2px;
}
.dz-steps li.fail {
  color: var(--bad);
  font-weight: 600;
}
.dz-why {
  color: var(--ink3);
  font-size: 12.5px;
}
.dz-side {
  display: grid;
  gap: 12px;
  align-content: start;
}
.dz code {
  font: 12px var(--mono);
  background: var(--pn2);
  border-radius: 5px;
  padding: 1px 5px;
}
.dz-strip {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 6px 16px;
  padding: 12px 16px;
  background: var(--pn2);
  border-radius: 8px;
  font-size: 13.5px;
}
.dz-strip.bad {
  background: var(--bads);
  color: var(--ink);
}
.dz-strip.ok {
  background: var(--gs);
  color: var(--ink);
}
.dz-strip .dz-st {
  grid-column: 1;
}
.dz-st {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.dz-st .bad {
  color: var(--bad);
}
.dz-env {
  grid-column: 1 / -1;
  color: var(--ink3);
  font-size: 12.5px;
  padding-left: 26px;
}
.dz-q {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 30px;
  padding: 0 8px;
  border-radius: 7px;
  font-size: 12.5px;
  color: var(--ink3);
}
.dz-q:hover,
.dz-q[aria-expanded="true"] {
  background: var(--pn2);
}
.dz-q b {
  font-size: 15px;
  font-weight: 650;
  color: var(--g);
}
.dz-q.bad b {
  color: var(--bad);
}
.dz-q svg {
  width: 14px;
  height: 14px;
}
.dz-scd {
  display: grid;
  gap: 10px;
  padding: 12px 16px;
}
.dz-scd .dz-parts {
  border-left: 0;
  padding-left: 0;
}
.dz-scd p {
  margin: 0;
  font-size: 12.5px;
  color: var(--ink2);
}
.dz-det.one {
  grid-template-columns: minmax(0, 1fr);
}
.dz-out {
  margin: 0;
  padding: 10px 12px;
  border-radius: 8px;
  background: var(--pn2);
  border-left: 3px solid var(--bad);
  font: 12px/1.65 var(--mono);
  white-space: pre-wrap;
  overflow-x: auto;
}
.dz-out i {
  font-style: normal;
  color: var(--ink3);
}
.dz-out .ok {
  color: var(--g);
}
.dz-out .bad {
  color: var(--bad);
}
.dz-blk {
  display: grid;
  min-width: 0;
}
.dz-file {
  display: flex;
  gap: 4px 8px;
  align-items: baseline;
  flex-wrap: wrap;
  margin-bottom: 4px;
  font-size: 12.5px;
}
.dz-file .mono {
  font-weight: 600;
}
.dz-file .mut {
  color: var(--ink3);
}
.dz-file em {
  font-style: normal;
  font-size: 11.5px;
  color: var(--o);
  background: var(--os);
  border-radius: 5px;
  padding: 1px 6px;
}
.dz-code {
  margin: 0;
  padding: 7px 0;
  border-radius: 8px;
  background: var(--pn2);
  font: 12px/1.6 var(--mono);
  overflow-x: auto;
}
.dz-code .ln {
  display: block;
  padding-right: 12px;
  white-space: pre;
}
.dz-code .ln i {
  display: inline-block;
  width: 40px;
  padding-right: 12px;
  text-align: right;
  font-style: normal;
  color: var(--ink3);
  user-select: none;
}
.dz-code.diff .ln i {
  width: 26px;
}
.dz-code .ln.hl,
.dz-code .ln.del {
  background: var(--bads);
}
.dz-code .ln.add {
  background: var(--gs);
}
.dz-code .ln.add i {
  color: var(--g);
}
.dz-code .ln.del i,
.dz-code .ln.hl i {
  color: var(--bad);
}
.dz-cmd {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 3px 3px 12px;
  border: 1px solid var(--ln);
  border-radius: 8px;
}
.dz-cmd code {
  flex: 1;
  min-width: 0;
  background: none;
  padding: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dz-cmd .kj3-ic {
  width: 28px;
  height: 28px;
}
.dz-more summary {
  cursor: pointer;
  width: max-content;
  color: var(--ink2);
  font-size: 12.5px;
}
.dz-more[open] summary {
  margin-bottom: 6px;
}
.dz-tr .dz-si {
  display: inline-grid;
  vertical-align: -4px;
  margin-right: 6px;
}
.dz-s {
  padding: 14px;
  display: grid;
  gap: 8px;
}
.dz-s h4 {
  margin: 0;
  font-size: 13.5px;
  font-weight: 650;
}
.dz-s p {
  margin: 0;
  color: var(--ink2);
  font-size: 12.5px;
}
.dz-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 34px;
  border-radius: 8px;
  border: 1px solid var(--ln2);
  font-weight: 600;
  font-size: 13.5px;
}
.dz-btn.pri {
  background: var(--gbtn);
  border-color: var(--gbtn);
  color: var(--gon);
}
.dz-pp {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
}
.dz-pp b {
  display: block;
  font-weight: 600;
}
.dz-pp small {
  display: block;
  color: var(--ink3);
  font-size: 12px;
}
.dz-ln {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  color: var(--ink2);
  font-size: 13px;
  padding: 2px 0;
}
.dz-ln svg {
  color: var(--ink3);
}
@container (max-width: 980px) {
  .dz-wrap {
    grid-template-columns: 1fr;
    padding: 16px 20px 32px;
  }
  .dz-side {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .dz-nav,
  .dz-ws {
    display: none;
  }
}
@container (max-width: 700px) {
  .dz-side {
    grid-template-columns: 1fr;
  }
  .dz-sc,
  .dz-det {
    grid-template-columns: 1fr;
  }
  .dz-parts {
    border-left: 0;
    padding-left: 0;
  }
  .dz-det {
    padding-left: 14px;
  }
  .dz-rh {
    grid-template-columns: 20px 28px minmax(0, 1fr) 16px;
  }
  .dz-rs,
  .dz-du {
    display: none;
  }
  .dz-q {
    margin-left: 0;
  }
}
/* Native details preserve the design button appearance; long real source text can wrap. */
#test-plan {
  container-type: inline-size;
  min-height: 100dvh;
}
.dz-row[open] .dz-rh > svg {
  transform: rotate(180deg);
}
.dz-title h1,
.dz-dl {
  overflow-wrap: anywhere;
}
.dz-id {
  overflow-wrap: anywhere;
  min-width: 0;
}
.dz-cmp b,
.dz-steps,
.dz-why {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.dz-back.placeholder {
  height: 19.5px;
}
.dz-code {
  max-width: 100%;
}
.dz-code .code-text {
  white-space: pre;
}
.dz-q:disabled {
  cursor: default;
}
.plan-select {
  min-width: 0;
  display: grid;
  gap: 6px;
}
.plan-select select {
  min-width: 0;
  width: 100%;
  max-width: 100%;
  background: var(--pn);
  border: 1px solid var(--ln);
  padding: 8px;
  border-radius: 8px;
}

/* Unavailable score has no pass/fail color. */
.dz-q:disabled b {
  color: var(--ink3);
}

  overflow: hidden;
}
.dz-pr {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto 70px;
  gap: 16px;
  align-items: center;
  width: 100%;
  padding: 12px 16px;
  border-top: 1px solid var(--ln);
  text-align: left;
  font-size: 13.5px;
}
.dz-pr:first-child {
  border-top: 0;
}
button.dz-pr:hover {
  background: var(--pn2);
}
.dz-pr-t {
  min-width: 0;
  display: grid;
  gap: 2px;
}
.dz-pr-t b {
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dz-pr-s {
  color: var(--ink3);
  font-size: 12.5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dz-pr-s .ok,
.dz-pr-s .bad {
  font-weight: 600;
}
.dz-pr-s .run {
  color: var(--o);
  font-weight: 600;
}
.dz-pr-w {
  color: var(--ink3);
  font-size: 12.5px;
  text-align: right;
}
.dz-mapc {
  overflow: hidden;
}
.dz-maph {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding: 10px 14px;
  border-bottom: 1px solid var(--ln);
  font-size: 13px;
  color: var(--ink2);
}
.dz-maph b {
  color: var(--ink);
}
.dz-maph > span {
  min-width: 0;
  overflow-wrap: anywhere;

.dz-lg {

  align-items: center;
  gap: 6px;
  color: var(--ink3);

.dz-lg i {

  border-radius: 3px;

  border: 1.5px solid var(--ln2);
}
.dz-lg i.chg {

.dz-lg i.pass {

.dz-lg i.fail {

.dz-mapw {

.dz-mzc button:hover {

.dz-node.pass {
  border-color: var(--g);

.dz-node.fail {

.dz-th {

.dz-tbl {

.dz-tr {

.dz-snapshot {

}
.dz-run-meta {

  color: var(--ink3);
}
.dz-run-meta dd {
  margin: 0;
  overflow-wrap: anywhere;
}
.dz-snapshot-test {
  display: grid;
  grid-template-columns: 20px minmax(40px, max-content) minmax(0, 1fr) auto;

}

}
.dz-tr.hd {
  border-top: 0;
  background: var(--pn2);
  color: var(--ink3);
  font-size: 12px;
  font-weight: 600;
}
.dz-chose,
.dz-learn,
.dz-act {
  padding: 14px 16px;
}
.dz-chose h3,
.dz-learn h3,
.dz-act h3 {
  margin: 0 0 10px;
  font-size: 14.5px;
  font-weight: 650;
}
.dz-chose dl,
.dz-learn dl {
  margin: 0;
  display: grid;
  grid-template-columns: 120px minmax(0, 1fr);
  gap: 8px 14px;
  font-size: 13px;
}
.dz-chose dt,
.dz-learn dt {
  color: var(--ink3);
}
.dz-chose dd,
.dz-learn dd {
  margin: 0;
}
.dz-fr.rq {
  grid-template-columns: 28px minmax(0, 1fr) minmax(0, 1fr);
}
.dz-fl {
  overflow: hidden;
}
.dz-fr {
  display: grid;
  grid-template-columns: minmax(0, 1.2fr) 80px minmax(0, 1fr) 76px;
  gap: 12px;
  align-items: center;
  padding: 9px 14px;
  border-top: 1px solid var(--ln);
  font-size: 13px;
}
.dz-fr:first-child {
  border-top: 0;
}
.dz-fp {
  min-width: 0;
  text-align: start;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dz-tcs {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.dz-tc {

  padding: 0 6px;
  border-radius: 5px;
  background: var(--pn2);
  color: var(--ink2);
}
.dz-tc.ok,
.dz-tc.fx {
  background: var(--gs);
  color: var(--g);
}
.dz-tc.fx {
  box-shadow: inset 0 0 0 1px var(--g);
}
.dz-tc.bad {
  background: var(--bads);
  color: var(--bad);
}
.dz-tr .dz-si {
  display: inline-grid;
  vertical-align: -4px;
  margin-right: 6px;
}
.dz-chose h3 .mut {
  margin-left: 6px;
  color: var(--ink3);
  font-size: 12.5px;
  font-weight: 500;
}
.dz-chose dl.mono {
  grid-template-columns: 96px minmax(0, 1fr);
  font: 12.5px/1.5 var(--mono);
}
@container (max-width: 700px) {
  .dz-tr {
    gap: 4px 8px;
    padding: 10px;
  }
  .dz-snapshot-test {
    grid-template-columns: 20px minmax(0, 1fr) auto;
  }
  .dz-snapshot-test > :nth-child(3) {
    grid-column: 2;
    grid-row: 2;
  }
  .dz-snapshot-test > :last-child {
    grid-column: 3;
    grid-row: 1;
  }
  .dz-fr {
    grid-template-columns: minmax(0, 1fr) auto;
  }
  .dz-fr > :nth-child(4) {
    display: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  .dz-rh > svg,
  .dz-gh > svg {
    transition: none;
  }
}

/* Missing replay frames keep the selected media geometry without invented video. */
.trace-placeholder {
  aspect-ratio: 4 / 3;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: var(--pn2);
  color: var(--ink3);
  font-size: 12px;
  text-align: center;
  padding: 12px;
}
.dz-play:disabled {
  cursor: default;
  opacity: 0.4;
}
.dz-seg {
  flex-wrap: wrap;
}

/* Media primitives from the selected design; no simulated playback. */
.dz-media {
  display: grid;
  gap: 10px;
  align-content: start;
}
.dz-vid {
  position: relative;
  margin: 0;
}
.dz-seg {

}
.dz-seg button {

  font-size: 12px;

.dz-seg button.on {

  color: var(--ink);

}
.dz-play {
  position: absolute;
  left: 50%;
  top: 42%;
  transform: translate(-50%, -50%);
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(12, 16, 14, 0.72);
  color: #fff;
  display: grid;
  place-items: center;
}
.dz-play svg {
  width: 18px;
  height: 18px;
  margin-left: 2px;
}
.dz-play:hover {
  background: rgba(12, 16, 14, 0.9);
}
.dz-vid figcaption {
  font-size: 11.5px;
  color: var(--ink3);
  padding-top: 5px;
}
.dz-seg {
  flex-wrap: wrap;
  justify-self: start;
}
.dz-fl > .dz-empty,
.dz-prs > .dz-empty {
  padding: 8px 14px;
}
.trace-placeholder {
  align-items: end;
  padding-bottom: 12px;
}

.dz-rh .dz-id {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dz-rh {
  grid-template-columns:
    20px var(--test-id-width, 28px) minmax(0, 1fr)
    auto 50px 16px;
}
@container (max-width: 700px) {

    grid-template-columns:

.code-disclosure-marker {

.dz-sec {

}
.dz-sec + .dz-sec,
.dz-card + .dz-sec {

.dz-row[open] > .dz-rh {

.dz-det {

}

.dz-tr {

}

.dz-snapshot h3 {

.dz-strip.ok .dz-st {

.dz-strip.bad .dz-st {

/* map: a screen is clickable; its panel lists the tests that went through it */

:root {
  --sans: var(
    --font-sans,
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Text",
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif
  );
  --win: var(--color-background-primary, #1a1a1a);
  --ink: var(--color-text-primary, #ececec);
  --ink2: var(--color-text-secondary, #c8c8c8);
  --muted: var(--color-text-tertiary, #9a9a9a);
  --line2: var(--color-background-secondary, #262626);
  --k-ink: #5fd3a0;
  --bad: var(--color-text-danger, #ff8a80);
  --card-line: rgba(255, 255, 255, 0.09);
  --card-sh: none;
  --chip: #2a2f37;
  --link: #8ab4f8;
}
body {
  background: transparent;
  font: 14px/1.5 var(--sans);
  color: var(--ink);
}
body.light {
  --win: var(--color-background-primary, #fff);
  --ink: var(--color-text-primary, #0d0d0d);
  --ink2: var(--color-text-secondary, #3d3d3d);
  --muted: var(--color-text-tertiary, #6b6b6b);
  --line2: var(--color-background-secondary, #ececec);
  --k-ink: #0b7a52;
  --bad: var(--color-text-danger, #b3261e);
  --card-line: rgba(0, 0, 0, 0.1);
  --card-sh: none;
  --chip: #eef2f7;
  --link: #2f5fa7;
}
.mono {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 12px;
}
.kj3 {
  border: 1px solid var(--card-line);
  border-radius: 20px;
  background: var(--win);
  box-shadow: var(--card-sh);
}
.kj3 {
  width: 100%;
  color: var(--ink);
  font-family: var(--sans);
}
.gh {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 22px;
  padding: 0 7px;
  border-radius: 7px;
  background: var(--chip);
  color: var(--link);
  cursor: default;
  white-space: nowrap;
  vertical-align: middle;
  flex: none;

.gh .mono {
  font-size: 12px;

  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0;
}
.kj3-h {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 12px 2px 16px;

  height: 20px;

.kj3-h .k-word {
  font-size: 14.5px;

.kj3-h .sp {
  flex: 1;

  display: inline-flex;

  font-weight: 500;

.kj3-det:hover,
