    <style>
      /* Selected 2 Nov design at 28d931c, adapted to native disclosures and supplied
 * report data. The approved README corrections own the three-column Runs view. */
:root {
  --sans:
    -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto,
    Helvetica, Arial, sans-serif;
  --blue: #4a86f0;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
}
button,
select,
summary {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
  background: none;
  border: 0;
  padding: 0;
}
button:disabled {
  cursor: default;
}
summary {
  cursor: pointer;
  list-style: none;
}
summary::-webkit-details-marker {
  display: none;
}
:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
svg.i {
  width: 17px;
  height: 17px;
  flex: none;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}
svg.i.sm {
  width: 14px;
  height: 14px;
  stroke-width: 1.8;
}
body.light {
  --blue: #3b78e7;
}
.num {
  font-variant-numeric: tabular-nums;
}
.ring {
  --v: 0;
  --rc: var(--k-ink);
  --rbg: var(--raise2);
  width: 54px;
  height: 54px;
  border-radius: 50%;
  flex: none;
  display: grid;
  place-items: center;
  position: relative;
  background: conic-gradient(var(--rc) calc(var(--v) * 1%), var(--line) 0);
}
.ring::before {
  content: "";
  position: absolute;
  inset: 5px;
  border-radius: 50%;
  background: var(--rbg);
}
.ring b {
  position: relative;
  font: 700 18px/1 var(--sans);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.4px;
}
.dz {
  --bg: #0d1117;
  --pn: #0d1117;
  --pn2: #151b23;
  --ln: #3d444d;
  --ln2: #4b535d;
  --ink: #f0f6fc;
  --ink2: #d1d7e0;
  --ink3: #9198a1;
  --g: #3fb950;
  --gbtn: #238636;
  --gon: #ffffff;
  --gs: #12261e;
  --bad: #f85149;
  --bads: #25171c;
  --o: #f0883e;
  --os: #2b1d12;
  --lnk: #4493f8;
  --side: #010409;
  --hov: #262c36;
  --line: var(--ln);
  --raise2: var(--pn);
  --k-ink: var(--g);
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  min-height: 100%;
  background: var(--bg);
  color: var(--ink);
  font:
    14px/1.5 -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans",
    Helvetica,
    Arial,
    sans-serif;
}
body.light .dz {
  --bg: #ffffff;
  --pn: #ffffff;
  --pn2: #f6f8fa;
  --ln: #d1d9e0;
  --ln2: #c3ccd5;
  --ink: #1f2328;
  --ink2: #3d444d;
  --ink3: #59636e;
  --g: #1a7f37;
  --gbtn: #1f883d;
  --gon: #ffffff;
  --gs: #dafbe1;
  --bad: #d1242f;
  --bads: #ffebe9;
  --o: #953800;
  --os: #fff1e5;
  --lnk: #0969da;
  --side: #f6f8fa;
  --hov: #eaeef2;
}
.dz .mono {
  font-family: var(--mono);
  font-size: 12px;
}
.dz .add {
  color: var(--g);
}
.dz .del {
  color: var(--bad);
}
.dz .bad {
  color: var(--bad);
}
.dz .ok {
  color: var(--g);
}
.dz .mut {
  color: var(--ink3);
}
.dz-top {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 18px;
  height: 52px;
  padding: 0 20px;
  background: var(--pn);
  border-bottom: 1px solid var(--ln);
}
.dz-brand {
  display: flex;
  align-items: center;
  gap: 8px;
}
.dz-brand img {
  width: 24px;
  height: 24px;
}
.dz-brand .k-word {
  font-size: 17px;
}
.dz-ws {
  color: var(--ink2);
  font-size: 13.5px;
  white-space: nowrap;
}
.dz-ws i {
  color: var(--ink3);
  font-style: normal;
  padding: 0 3px;
}
.dz-nav {
  display: flex;
  gap: 2px;
  margin-left: 8px;
}
.dz-nav span,
.dz-nav button {
  padding: 6px 10px;
  border-radius: 8px;
  color: var(--ink3);
  font-size: 13.5px;
  font-weight: 500;
  white-space: nowrap;
}
.dz-nav .on {
  color: var(--ink);
  background: var(--gs);
}
.dz-top .sp {
  flex: 1;
}
.dz-av {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--gs);
  color: var(--g);
  font-size: 12px;
  font-weight: 700;
  flex: none;
}
.dz-av.sm {
  width: 26px;
  height: 26px;
  font-size: 10.5px;
}
.dz-wrap {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 24px;
  padding: 18px 24px 40px;
  max-width: 980px;
  margin: 0 auto;
}
.dz-main {
  min-width: 0;
  display: grid;
  gap: 22px;
  align-content: start;
}
.dz-back {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  color: var(--ink3);
  margin: -4px 0 -6px;
  font-size: 14px;
  width: max-content;
}
.dz-back[hidden] {
  display: none;
}
.dz-back svg {
  width: 16px;
  height: 16px;
}
button.dz-back:hover {
  color: var(--ink);
}
.dz-wrap.one {
  grid-template-columns: minmax(0, 1fr);
  max-width: 900px;
}
.dz-title {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: -6px;
}
.dz-title h1 {
  font-size: 24px;
  line-height: 1.2;
  letter-spacing: -0.6px;
  margin: 0;
  font-weight: 700;
}
.dz-title h1 span {
  color: var(--ink3);
  font-weight: 500;
}
.dz-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  font-weight: 600;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--pn2);
  color: var(--ink2);
}
.dz-pill.ok {
  background: var(--gs);
  color: var(--g);
}
.dz-pill.bad {
  background: var(--bads);
  color: var(--bad);
}
.dz-pill .spin {
  width: 11px;
  height: 11px;
  border-color: var(--ln2);
  border-top-color: var(--g);
}
.dz-meta {
  margin: -8px 0 0;
  color: var(--ink2);
  font-size: 13px;
}
.dz-tabs {
  display: flex;
  gap: 4px;
  border-bottom: 0;
}
.dz-tabs button {
  height: 32px;
  padding: 0 12px;
  border: 0;
  border-radius: 6px;
  color: var(--ink3);
  font-size: 14px;
  font-weight: 600;
  margin: 0;
}
.dz-tabs button:hover {
  color: var(--ink);
  background: var(--hov);
}
.dz-tabs button.on {
  color: var(--ink);
  background: var(--pn2);
  box-shadow: inset 0 -2px 0 #fd8c73;
}
.dz-tabs button span {
  color: var(--ink3);
  font-weight: 500;
}
.dz-card {
  border: 0;
  border-radius: 8px;
  background: none;
}
.dz-empty {
  display: flex;
  align-items: center;
  gap: 12px;
  color: var(--ink2);
  margin: 6px 0;
}
.dz-empty img {
  width: 44px;
  height: 44px;
}
.dz-sc {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
  gap: 20px;
  padding: 18px 20px;
}
.dz-sc.wait {
  grid-template-columns: 1fr;
}
.dz-sc-l {
  display: flex;
  gap: 16px;
  align-items: center;
}
.ring.big {
  width: 76px;
  height: 76px;
  --rbg: var(--pn);
}
.ring.big::before {
  inset: 7px;
}
.ring.big b {
  font-size: 25px;
}
.dz-sc.s-bad .ring {
  --rc: var(--bad);
}
.dz-k {
  display: block;
  color: var(--ink3);
  font-size: 12.5px;
}
.dz-sc .v {
  display: block;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: -0.3px;
  margin: 1px 0 3px;
}
.dz-sc.s-ok .v {
  color: var(--g);
}
.dz-sc.s-bad .v {
  color: var(--bad);
}
.dz-sc p {
  margin: 0;
  color: var(--ink2);
  font-size: 13px;
}
.dz-sc .dz-sum {
  margin-top: 8px;
  color: var(--ink3);
}
.dz-title .sp {
  flex: 1;
}
.dz-title .dz-btn {
  padding: 0 12px;
  height: 32px;
  font-weight: 500;
}
.dz-btn svg.i {
  width: 14px;
  height: 14px;
}
.dz-parts {
  list-style: none;
  margin: 0;
  padding: 0 0 0 20px;
  border-left: 1px solid var(--ln);
  display: grid;
  gap: 7px;
  align-content: center;
}
.dz-parts li {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 70px 38px;
  gap: 10px;
  align-items: center;
  font-size: 13px;
}
.dz-parts .l {
  min-width: 0;
}
.dz-parts small {
  display: block;
  color: var(--ink3);
  font-size: 11.5px;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dz-pb {
  height: 5px;
  border-radius: 3px;
  background: var(--pn2);
  overflow: hidden;
}
.dz-pb i {
  display: block;
  height: 100%;
  background: var(--g);
  border-radius: 3px;
}
.dz-parts b {
  text-align: right;
  font-weight: 600;
}
.dz-sec {
  display: grid;
  gap: 8px;
}
.dz-sec h2 {
  margin: 6px 0 0;
  font-size: 16px;
  font-weight: 650;
  letter-spacing: -0.2px;
}
.dz-sec h2 span {
  color: var(--ink3);
  font-weight: 500;
}
.dz-grp {
  border: 0;
  border-radius: 8px;
  background: none;
  overflow: hidden;
}
.dz-grp h3 {
  margin: 0;
  padding: 9px 14px;
  font-size: 13px;
  font-weight: 650;
  display: flex;
  gap: 8px;
  background: var(--pn2);
  border-bottom: 1px solid var(--ln);
}
.dz-grp h3 span {
  color: var(--ink3);
  font-weight: 500;
}
.dz-gh {
  display: flex;
  align-items: baseline;
  gap: 8px;
  width: 100%;
  padding: 6px 8px;
  border-radius: 6px;
  text-align: left;
  font-size: 13.5px;
}
.dz-gh:hover {
  background: var(--pn2);
}
.dz-gh > svg {
  width: 14px;
  height: 14px;
  color: var(--ink3);
  align-self: center;
  transform: rotate(-90deg);
  transition: transform 0.15s;
  flex: none;
}
.dz-gh b {
  font-weight: 650;
}
.dz-gh .sp {
  flex: 1;
}
.dz-gs {
  max-width: 48%;
  color: var(--ink3);
  text-align: right;
  font-size: 12.5px;
}
.dz-grp[open] > .dz-gh > svg {
  transform: none;
}
.dz-row[open] > .dz-rh > svg {
  transform: rotate(180deg);
}
.dz-grp + .dz-grp {
  margin-top: 2px;
}
.dz-grp .dz-row .dz-rh {
  padding-left: 22px;
}
.dz-sec > .dz-row {
  border: 0;
  border-radius: 8px;
  background: none;
  overflow: hidden;
}
.dz-grp .dz-row + .dz-row {
  border-top: 0;
}
.dz-rh {
  display: grid;
  grid-template-columns: 20px 28px minmax(0, 1fr) auto 50px 16px;
  gap: 10px;
  align-items: center;
  width: 100%;
  padding: 9px 8px;
  border-radius: 6px;
  text-align: left;
  font-size: 13.5px;
}
.dz-rh:hover {
  background: var(--pn2);
}
.dz-rh > svg {
  color: var(--ink3);
  transition: transform 0.15s;
}
.dz-row.open .dz-rh > svg {
  transform: rotate(180deg);
}
.dz-si {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  box-shadow: inset 0 0 0 1.5px var(--ln2);
}
.dz-si.pass {
  background: none;
  color: var(--g);
  box-shadow: none;
}
.dz-si.fail {
  background: none;
  color: var(--bad);
  box-shadow: none;
}
.dz-si.run {
  box-shadow: none;
}
.dz-si svg.i.sm {
  width: 14px;
  height: 14px;
  stroke-width: 2.4;
}
.dz-si .spin {
  width: 14px;
  height: 14px;
  border-color: var(--ln2);
  border-top-color: var(--g);
}
.dz-id {
  color: var(--ink3);
}
.dz-tt {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dz-tt.dz-observation {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  white-space: normal;
  overflow-wrap: anywhere;
}
.dz-tt em {
  font-style: normal;
  font-size: 11.5px;
  color: var(--o);
  background: var(--os);
  border-radius: 5px;
  padding: 1px 6px;
  margin-left: 8px;
}
.dz-rs {
  color: var(--ink3);
  font-size: 12.5px;
  white-space: nowrap;
}
.dz-rs.bad {
  color: var(--bad);
  font-weight: 600;
}
.dz-rs.ok {
  color: var(--g);
  font-weight: 600;
}
.dz-du {
  color: var(--ink3);
  text-align: right;
}
.dz-det {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 260px;
  gap: 18px;
  padding: 4px 14px 16px 52px;
}
.dz-dl {
  display: grid;
  gap: 10px;
  align-content: start;
  font-size: 13px;
  min-width: 0;
}
.dz-dl p {
  margin: 0;
}
.dz-cmp {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 8px;
}
.dz-cmp div {
  border: 1px solid var(--ln);
  border-radius: 9px;
  padding: 8px 10px;
}
.dz-cmp div.bad {
  border-color: color-mix(in srgb, var(--bad) 45%, transparent);
  background: var(--bads);
  color: inherit;
}
.dz-cmp div.ok {
  border-color: color-mix(in srgb, var(--g) 45%, transparent);
  background: var(--gs);
  color: inherit;
}
.dz-cmp span {
  display: block;
  color: var(--ink3);
  font-size: 11.5px;
}
.dz-cmp b {
  font-weight: 600;
}
.dz-note {
  color: var(--ink2);
}
.dz-steps {
  margin: 0;
  padding-left: 18px;
  color: var(--ink2);
  display: grid;
  gap: 2px;
}
.dz-steps li.fail {
  color: var(--bad);
  font-weight: 600;
}
.dz-why {
  color: var(--ink3);
  font-size: 12.5px;
}
.dz-side {
  display: grid;
  gap: 12px;
  align-content: start;
}
.dz code {
  font: 12px var(--mono);
  background: var(--pn2);
  border-radius: 5px;
  padding: 1px 5px;
}
.dz-strip {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 6px 16px;
  padding: 12px 16px;
  background: var(--pn2);
  border-radius: 8px;
  font-size: 13.5px;
}
.dz-strip.bad {
  background: var(--bads);
  color: var(--ink);
}
.dz-strip.ok {
  background: var(--gs);
  color: var(--ink);
}
.dz-strip .dz-st {
  grid-column: 1;
}
.dz-tests-observation {
  grid-column: 1 / -1;
  margin: 0;
  padding-left: 26px;
  overflow-wrap: anywhere;
}
.dz-st {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.dz-st .bad {
  color: var(--bad);
}
.dz-env {
  grid-column: 1 / -1;
  color: var(--ink3);
  font-size: 12.5px;
  padding-left: 26px;
}
.dz-q {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 30px;
  padding: 0 8px;
  border-radius: 7px;
  font-size: 12.5px;
  color: var(--ink3);
}
.dz-q:hover,
.dz-q[aria-expanded="true"] {
  background: var(--pn2);
}
.dz-q b {
  font-size: 15px;
  font-weight: 650;
  color: var(--g);
}
.dz-q.bad b {
  color: var(--bad);
}
.dz-q svg {
  width: 14px;
  height: 14px;
}
.dz-scd {
  display: grid;
  gap: 10px;
  padding: 12px 16px;
}
.dz-scd .dz-parts {
  border-left: 0;
  padding-left: 0;
}
.dz-scd p {
  margin: 0;
  font-size: 12.5px;
  color: var(--ink2);
}
.dz-det.one {
  grid-template-columns: minmax(0, 1fr);
}
.dz-out {
  margin: 0;
  padding: 10px 12px;
  border-radius: 8px;
  background: var(--pn2);
  border-left: 3px solid var(--bad);
  font: 12px/1.65 var(--mono);
  white-space: pre-wrap;
  overflow-x: auto;
}
.dz-out i {
  font-style: normal;
  color: var(--ink3);
}
.dz-out .ok {
  color: var(--g);
}
.dz-out .bad {
  color: var(--bad);
}
.dz-blk {
  display: grid;
  min-width: 0;
}
.dz-file {
  display: flex;
  gap: 4px 8px;
  align-items: baseline;
  flex-wrap: wrap;
  margin-bottom: 4px;
  font-size: 12.5px;
}
.dz-file .mono {
  font-weight: 600;
}
.dz-file .mut {
  color: var(--ink3);
}
.dz-file em {
  font-style: normal;
  font-size: 11.5px;
  color: var(--o);
  background: var(--os);
  border-radius: 5px;
  padding: 1px 6px;
}
.dz-code {
  margin: 0;
  padding: 7px 0;
  border-radius: 8px;
  background: var(--pn2);
  font: 12px/1.6 var(--mono);
  overflow-x: auto;
}
.dz-code .ln {
  display: block;
  padding-right: 12px;
  white-space: pre;
}
.dz-code .ln i {
  display: inline-block;
  width: 40px;
  padding-right: 12px;
  text-align: right;
  font-style: normal;
  color: var(--ink3);
  user-select: none;
}
.dz-code.diff .ln i {
  width: 26px;
}
.dz-code .ln.hl,
.dz-code .ln.del {
  background: var(--bads);
}
.dz-code .ln.add {
  background: var(--gs);
}
.dz-code .ln.add i {
  color: var(--g);
}
.dz-code .ln.del i,
.dz-code .ln.hl i {
  color: var(--bad);
}
.dz-cmd {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 3px 3px 12px;
  border: 1px solid var(--ln);
  border-radius: 8px;
}
.dz-cmd code {
  flex: 1;
  min-width: 0;
  background: none;
  padding: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dz-cmd .kj3-ic {
  width: 28px;
  height: 28px;
}
.dz-more summary {
  cursor: pointer;
  width: max-content;
  color: var(--ink2);
  font-size: 12.5px;
}
.dz-more[open] summary {
  margin-bottom: 6px;
}
.dz-tr .dz-si {
  display: inline-grid;
  vertical-align: -4px;
  margin-right: 6px;
}
.dz-s {
  padding: 14px;
  display: grid;
  gap: 8px;
}
.dz-s h4 {
  margin: 0;
  font-size: 13.5px;
  font-weight: 650;
}
.dz-s p {
  margin: 0;
  color: var(--ink2);
  font-size: 12.5px;
}
.dz-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 34px;
  border-radius: 8px;
  border: 1px solid var(--ln2);
  font-weight: 600;
  font-size: 13.5px;
}
.dz-btn.pri {
  background: var(--gbtn);
  border-color: var(--gbtn);
  color: var(--gon);
}
.dz-pp {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
}
.dz-pp b {
  display: block;
  font-weight: 600;
}
.dz-pp small {
  display: block;
  color: var(--ink3);
  font-size: 12px;
}
.dz-ln {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  color: var(--ink2);
  font-size: 13px;
  padding: 2px 0;
}
.dz-ln svg {
  color: var(--ink3);
}
@container (max-width: 980px) {
  .dz-wrap {
    grid-template-columns: 1fr;
    padding: 16px 20px 32px;
  }
  .dz-side {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .dz-nav,
  .dz-ws {
    display: none;
  }
}
@container (max-width: 700px) {
  .dz-side {
    grid-template-columns: 1fr;
  }
  .dz-sc,
  .dz-det {
    grid-template-columns: 1fr;
  }
  .dz-parts {
    border-left: 0;
    padding-left: 0;
  }
  .dz-det {
    padding-left: 14px;
  }
  .dz-rh {
    grid-template-columns: 20px 28px minmax(0, 1fr) 16px;
  }
  .dz-rs,
  .dz-du {
    display: none;
  }
  .dz-rh:has(> .dz-proposed-result) {
    row-gap: 2px;
  }
  .dz-rh > .dz-proposed-result {
    display: block;
    grid-column: 3;
    grid-row: 2;
    white-space: normal;
  }
  .dz-q {
    margin-left: 0;
  }
}
/* Native details preserve the design button appearance; long real source text can wrap. */
#test-plan {
  container-type: inline-size;
  min-height: 100dvh;
}
.dz-row[open] .dz-rh > svg {
  transform: rotate(180deg);
}
.dz-title h1,
.dz-dl {
  overflow-wrap: anywhere;
}
.dz-id {
  overflow-wrap: anywhere;
  min-width: 0;
}
.dz-cmp b,
.dz-steps,
.dz-why {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.dz-back.placeholder {
  height: 19.5px;
}
.dz-code {
  max-width: 100%;
}
.dz-code .code-text {
  white-space: pre;
}
.dz-q:disabled {
  cursor: default;
}
.plan-select {
  min-width: 0;
  display: grid;
  gap: 6px;
}
.plan-select select {
  min-width: 0;
  width: 100%;
  max-width: 100%;
  background: var(--pn);
  border: 1px solid var(--ln);
  padding: 8px;
  border-radius: 8px;
}

/* Unavailable score has no pass/fail color. */
.dz-q:disabled b {
  color: var(--ink3);
}

/* Additional report pages copied from the same selected main design. */
.dz-prs {
  overflow: hidden;
}
.dz-pr {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto 70px;
  gap: 16px;
  align-items: center;
  width: 100%;
  padding: 12px 16px;
  border-top: 1px solid var(--ln);
  text-align: left;
  font-size: 13.5px;
}
.dz-pr:first-child {
  border-top: 0;
}
button.dz-pr:hover {
  background: var(--pn2);
}
.dz-pr-t {
  min-width: 0;
  display: grid;
  gap: 2px;
}
.dz-pr-t b {
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dz-pr-s {
  color: var(--ink3);
  font-size: 12.5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dz-pr-s .ok,
.dz-pr-s .bad {
  font-weight: 600;
}
.dz-pr-s .run {
  color: var(--o);
  font-weight: 600;
}
.dz-pr-w {
  color: var(--ink3);
  font-size: 12.5px;
  text-align: right;
}
.dz-mapc {
  overflow: hidden;
}
.dz-maph {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  padding: 10px 14px;
  border-bottom: 1px solid var(--ln);
  font-size: 13px;
  color: var(--ink2);
}
.dz-maph b {
  color: var(--ink);
}
.dz-maph > span {
  min-width: 0;
  overflow-wrap: anywhere;
}
.dz-lg {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--ink3);
  font-size: 12.5px;
}
.dz-lg i {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  margin-left: 8px;
  border: 1.5px solid var(--ln2);
}
.dz-lg i.chg {
  border: 1.5px dashed var(--o);
}
.dz-lg i.pass {
  border-color: var(--g);
}
.dz-lg i.fail {
  border-color: var(--bad);
}
.dz-mapw {
  position: relative;
  overflow: hidden;
  height: max(320px, calc(100dvh - 270px));
  cursor: grab;
  background:
    radial-gradient(circle, var(--ln) 1px, transparent 1.2px) 0 0 / 16px 16px,
    var(--bg);
}
.dz-map {
  position: absolute;
  margin: 0;
  transform-origin: 0 0;
}
.dz-mapw.drag {
  cursor: grabbing;
  user-select: none;
}
.dz-mzc {
  position: absolute;
  right: 12px;
  bottom: 12px;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--ln2);
  border-radius: 8px;
  background: var(--pn);
}
.dz-mzc button {
  min-width: 32px;
  min-height: 32px;
  padding: 4px 8px;
  border-radius: 5px;
}
.dz-mzc button:hover {
  background: var(--pn2);
}
.dz-mzc output {
  min-width: 50px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.dz-mzh {
  position: absolute;
  left: 12px;
  bottom: 12px;
  max-width: calc(100% - 230px);
  margin: 0;
  padding: 3px 5px;
  color: var(--ink2);
  background: var(--bg);
  font-size: 11px;
  pointer-events: none;
}
@media (max-width: 480px) {
  .dz-mzh {
    bottom: 58px;
    max-width: calc(100% - 24px);
  }
}
.dz-map svg {
  position: absolute;
  inset: 0;
}
.dz-map line,
.dz-map > svg > path {
  stroke: var(--ink3);
  stroke-width: 1.5;
  fill: none;
}

.dz-chose,

.dz-learn dt {

}
.dz-chose dd,
.dz-learn dd {

.dz-fr.rq {

.dz-fl {

.dz-tc.ok,
.dz-tc.fx {

}

    grid-row: 2;

  .dz-snapshot-test > :last-child {
    grid-column: 3;
    grid-row: 1;
  }
  .dz-fr {
    grid-template-columns: minmax(0, 1fr) auto;
  }
  .dz-fr > :nth-child(4) {

@media (prefers-reduced-motion: reduce) {

.dz-seg {

.dz-fl > .dz-empty,

.dz-rh .dz-id {

  margin-top: 6px;
}

.case-evidence {
  margin-block: 0;
  min-width: 0;
}
.case-evidence > button {
  padding: 6px 10px;
  border: 1px solid var(--ln, #888);
  border-radius: 6px;
  background: transparent;
  color: inherit;
  cursor: pointer;
}
.case-screenshot {
  display: block;
  width: 100%;
  height: auto;
  border: 1px solid var(--ln, #888);
}
.dz-det:has(.case-evidence) {
  grid-template-columns: minmax(0, 1fr);
}
.dz-media:has(.case-evidence) {
  width: 100%;
  max-width: none;
}

.case-evidence-header,
.case-gallery-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px 16px;
}
.case-evidence-header h3 {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
}
.case-evidence-header .trace-controls {
  margin: 0;
  justify-content: flex-end;
}
.case-evidence-header .trace-controls p {
  margin: 0;
  text-align: right;
}
.case-gallery {
  margin-top: 16px;
}
.case-gallery-toolbar {
  margin-bottom: 8px;
  font-size: 12px;
  color: var(--ink3, var(--muted, CanvasText));
}
.case-gallery select {
  max-width: 100%;
  padding: 6px 8px;
  font: inherit;
  color: var(--ink, CanvasText);
  background: var(--pn2, var(--raise, Canvas));
  border: 1px solid var(--ln, #888);
  border-radius: 6px;
}
.case-screenshot {
  border-radius: 8px;
}
.dz-det:has([data-case-evidence]) {
  grid-template-columns: minmax(0, 1fr);
}
.dz-media:has([data-case-evidence]) {
  width: 100%;
  max-width: none;
}

.dz-media:has([data-case-evidence]) > .dz-note {
  margin: 0;
  font-size: 12px;
}
.case-evidence-header h3 {
  padding: 0;
  background: none;
  border: 0;
}
.case-evidence-header {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
}
.case-evidence-header .trace-controls {
  max-width: 240px;
}

.case-gallery-toolbar .trace-controls {
  margin: 0 0 0 auto;
  justify-content: flex-end;
}
.case-gallery-toolbar .trace-controls p {
  margin: 0;
  text-align: right;
}
